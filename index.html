<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>いろどり漢字</title>

<style>

body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}


/* コース名 */

.course-title {
  font-size: 28px;
  font-weight: bold;
  margin: 10px 0 12px;
}

/* 選択後に表示する範囲名 */

.selected-range-title {
  display: none;
  font-size: 28px;
  font-weight: bold;
  margin: 0 0 10px;
}

/* 課選択ボタン */

.lesson-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 24px;
}

.lesson-button {
  font-size: 24px;
  line-height: 1.1;
  padding: 12px 25px;
  border: 2px solid #999;
  border-radius: 12px;
  background: #eee;
  color: #333;
  cursor: pointer;
}

.lesson-button.active {
  background: #333;
  color: white;
  border-color: #333;
}


/* 漢字 */

.question {
  display: none;
  font-size: clamp(80px, 35vw, 220px);
  margin: 20px 0 10px;
  line-height: 1.1;
  white-space: nowrap;
  width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}


/* 読み方 */

.reading {
  display: none;
  font-size: clamp(40px, 10vw, 70px);
  color: #333;
  height: 90px;
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  overflow: hidden;
}


/* クメール語 */

.khmer {
  display: none;
  font-size: clamp(28px, 7vw, 50px);
  color: #555;
  height: 90px;
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  overflow: hidden;
}


/* 三角ボタン */

.answer-button {
  display: none;
  font-size: clamp(50px, 12vw, 80px);
  padding: 18px 40px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
}


/* 右上の問題数カウンター */
.counter {
  display: none;
  position: fixed;
  top: 10px;
  right: 15px;
  font-size: 40px;
  color: #888;
  z-index: 1000;
}

/* Excel読み込み中 */

.loading {
  font-size: 24px;
  color: #666;
  margin-top: 50px;
}


@media (max-width: 600px) {

  body {
    padding: 10px;
  }

  .lesson-buttons {
    gap: 8px;
    margin-bottom: 20px;
  }

  .lesson-button {
    font-size: 20px;
    padding: 14px 8px;
    flex: 1;
  }

  .course-title {
    font-size: 24px;
  }

  .selected-range-title {
    font-size: 24px;
  }

  .reading {
    height: 90px;
    margin-bottom: 20px;
  }

  .khmer {
    height: 90px;
    margin-bottom: 20px;
  }

  .answer-button {
    width: 90%;
    max-width: 320px;
  }

}

</style>


<!-- SheetJS -->

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>


<!-- Google Analytics -->

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DDD1Y5SELD"></script>

<script>

window.dataLayer = window.dataLayer || [];

function gtag() {
  dataLayer.push(arguments);
}

gtag('js', new Date());

gtag('config', 'G-DDD1Y5SELD');

</script>

</head>


<body>


<!-- コース・課範囲選択 -->

<div class="course-title">A1</div>
<div class="lesson-buttons">
  <button class="lesson-button" id="a1-l1-6"
    onclick="selectLessonRange('A1', 'L1~6')">L1~6</button>
  <button class="lesson-button" id="a1-l1-12"
    onclick="selectLessonRange('A1', 'L1~12')">L1~12</button>
  <button class="lesson-button" id="a1-l1-18"
    onclick="selectLessonRange('A1', 'L1~18')">L1~18</button>
</div>

<div class="course-title">A2.1</div>
<div class="lesson-buttons">
  <button class="lesson-button" id="a21-l1-6"
    onclick="selectLessonRange('A2.1', 'L1~6')">L1~6</button>
  <button class="lesson-button" id="a21-l1-12"
    onclick="selectLessonRange('A2.1', 'L1~12')">L1~12</button>
  <button class="lesson-button" id="a21-l1-18"
    onclick="selectLessonRange('A2.1', 'L1~18')">L1~18</button>
</div>

<div class="selected-range-title" id="selected-range-title"></div>

<div
  class="loading"
  id="loading">

  漢字データを読み込んでいます……

</div>


<div
  class="question"
  id="question">
</div>


<div
  class="reading"
  id="reading">
</div>


<div
  class="khmer"
  id="khmer">
</div>


<button
  class="answer-button"
  onclick="handle()">

  ▶

</button>


<div
  class="counter"
  id="counter">

  0

</div>


<script>


/* =========================================
   データ
   ========================================= */

let originalWords = [];

let words = [];

let currentIndex = 0;

let revealed = false;

let questionCount = 0;

let selectedCourse = 'A1';

let selectedLessonRange = 'L1~6';


/* =========================================
   Excel読み込み
   ========================================= */

async function loadExcel() {

  try {

    const response =
      await fetch("いろどり漢字.xlsx");


    if (!response.ok) {

      throw new Error(
        "Excelファイルを読み込めませんでした。"
      );

    }


    const arrayBuffer =
      await response.arrayBuffer();


    const workbook =
      XLSX.read(arrayBuffer, {
        type: "array"
      });


    /*
      使用するシート
      現在は先頭のシートを使用
    */

    if (
      !workbook.SheetNames ||
      workbook.SheetNames.length === 0
    ) {

      throw new Error(
        "Excelにシートがありません。"
      );

    }


    const sheetName =
      workbook.SheetNames[0];


    const sheet =
      workbook.Sheets[sheetName];


    if (!sheet) {

      throw new Error(
        "Excelのシートを取得できませんでした。"
      );

    }


    /*
     * Excelを配列として取得
     *
     * A列：コース名
     * B列：課番号（数値）
     * C列：漢字
     * D列：読み方
     * E列：クメール語
     */

    const rows =
      XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });


    if (rows.length < 2) {

      throw new Error(
        "Excelに漢字データがありません。"
      );

    }


    originalWords = [];


    /*
     * 1行目は見出し
     * 2行目から読み込む
     */

    for (
      let i = 1;
      i < rows.length;
      i++
    ) {

      const row = rows[i];


      if (!row) {
        continue;
      }


      /*
       * A～E列を取得
       */

      const course =
        String(row[0] ?? "").trim();

      const lessonRange =
        Number(row[1]);

      const kanji =
        String(row[2] ?? "").trim();

      const reading =
        String(row[3] ?? "").trim();

      const khmer =
        String(row[4] ?? "").trim();


      /*
       * 漢字が空欄なら無視
       */

      if (kanji === "") {
        continue;
      }


      /*
       * コース名または課番号が不正なら無視
       */

      if (
        course === "" ||
        !Number.isFinite(lessonRange) ||
        lessonRange < 1
      ) {
        continue;
      }


      originalWords.push({

        course: course,

        lessonRange: lessonRange,

        w: kanji,

        r: reading,

        k: khmer

      });

    }


    /*
     * データが1件もない場合
     */

    if (originalWords.length === 0) {

      throw new Error(
        "漢字データが見つかりませんでした。"
      );

    }


    /*
     * 読み込み完了
     */

    document.getElementById(
      "loading"
    ).style.display = "none";


    /*
     * 起動時はコース・課範囲の選択画面だけを表示
     * ボタンを押すと問題画面を開始する
     */


  } catch (error) {

    console.error(error);


    document.getElementById(
      "loading"
    ).textContent =
      "いろどり漢字.xlsxを読み込めませんでした。";

  }

}


/* =========================================
   課範囲選択
   ========================================= */

function normalizeLessonRange(value) {
  return String(value ?? "")
    .trim()
    .replace(/[～〜−－~]/g, "-")
    .replace(/\s+/g, "")
    .toUpperCase();
}


/* =========================================
   課範囲選択
   ========================================= */

function selectLessonRange(course, lessonRange) {

  selectedCourse = course;
  selectedLessonRange = lessonRange;

  /* 選択画面を隠し、選択した範囲名だけを上部に表示 */
  document.querySelectorAll(".course-title, .lesson-buttons").forEach(element => {
    element.style.display = "none";
  });

  const rangeTitle = document.getElementById("selected-range-title");

  rangeTitle.textContent = course + "  " + lessonRange;

  rangeTitle.style.display = "block";


  /*
   * 6個のボタンのON/OFF
   */

  const buttonIds = [
    "a1-l1-6",
    "a1-l1-12",
    "a1-l1-18",
    "a21-l1-6",
    "a21-l1-12",
    "a21-l1-18"
  ];

  buttonIds.forEach(id => {
    document.getElementById(id).classList.remove("active");
  });

  const selectedButtonId =
    (course === "A1" ? "a1-" : "a21-") +
    lessonRange.toLowerCase().replace("~", "-");

  const selectedButton = document.getElementById(selectedButtonId);

  if (selectedButton) {
    selectedButton.classList.add("active");
  }


  /* 選択後に漢字・解答ボタン・カウンターを表示 */

  document.getElementById("question").style.display = "block";

  document.getElementById("reading").style.display = "flex";

  document.getElementById("khmer").style.display = "flex";

  document.querySelector(".answer-button").style.display = "inline-block";

  document.getElementById("counter").style.display = "block";


  /* 選択されたコース・課範囲の問題を作成 */

  createWords();

  currentIndex = 0;

  revealed = false;

  render();

}


/* =========================================
   選択されたコース・課範囲の問題を作成
   ========================================= */

function createWords() {

  /*
   * 選択した範囲の上限を取得
   * 例：L1~6 → 6、L1~12 → 12、L1~18 → 18
   */

  const selectedEndMatch =
    normalizeLessonRange(selectedLessonRange).match(/L1-(\d+)/);

  const selectedEnd = selectedEndMatch
    ? Number(selectedEndMatch[1])
    : 0;


  /*
   * ExcelのB列は課番号（1、2、3……）。
   * 選択した上限までの課番号をまとめて表示する。
   */

  const filteredWords =
    originalWords.filter(word => {

      const lessonNumber = Number(word.lessonRange);

      return (
        word.course === selectedCourse &&
        Number.isFinite(lessonNumber) &&
        lessonNumber >= 1 &&
        lessonNumber <= selectedEnd
      );

    });


  words =
    smartShuffle(
      [...filteredWords]
    );

  currentIndex = 0;

  revealed = false;

}


/* =========================================
   スマートシャッフル
   ========================================= */

function smartShuffle(arr) {

  const result = [];

  const pool = [...arr];

  let lastLessonRange = null;


  while (pool.length > 0) {

    /*
     * 前回と違う課を優先
     */

    let candidates =
      pool.filter(
        word =>
          word.lessonRange !== lastLessonRange
      );


    /*
     * 選べる課がない場合
     * 同じ課も候補にする
     */

    if (candidates.length === 0) {

      candidates = pool;

    }


    /*
     * ランダムに1問選択
     */

    const pick =
      candidates[
        Math.floor(
          Math.random() *
          candidates.length
        )
      ];


    result.push(pick);


    /*
     * 選択した問題をpoolから削除
     */

    const index =
      pool.indexOf(pick);


    if (index !== -1) {

      pool.splice(index, 1);

    }


    lastLessonRange =
      pick.lessonRange;

  }


  return result;

}


/* =========================================
   表示更新
   ========================================= */

function render() {

  /*
   * 問題がない場合
   */

  if (words.length === 0) {

    document.getElementById(
      "question"
    ).textContent = "";


    document.getElementById(
      "reading"
    ).textContent = "";


    document.getElementById(
      "khmer"
    ).textContent = "";


    document.getElementById(
      "counter"
    ).textContent = "0";


    return;

  }


  const word =
    words[currentIndex];


  /*
   * 漢字
   */

  document.getElementById(
    "question"
  ).textContent =
    word.w;


  /*
   * カウンター
   */

  document.getElementById(
    "counter"
  ).textContent =
    currentIndex + 1;


  /*
   * 読み方
   * ▶を1回押すまで文字を表示しない
   */

  document.getElementById(
    "reading"
  ).textContent =
    revealed
      ? word.r
      : "";


  /*
   * クメール語
   * ▶を1回押すまで文字を表示しない
   */

  document.getElementById(
    "khmer"
  ).textContent =
    revealed
      ? word.k
      : "";


  adjustQuestionSize();

}


/* =========================================
   漢字のサイズ自動調整
   ========================================= */

function adjustQuestionSize() {

  const question =
    document.getElementById("question");

  const text =
    question.textContent;


  /*
   * 1～4文字は160px
   */

  if (text.length <= 4) {

    question.style.fontSize = "160px";

    return;

  }


  /*
   * 5文字以上の場合
   * まず160pxに戻す
   */

  question.style.fontSize = "160px";


  /*
   * 画面幅に収まるまで縮小
   */

  const maxWidth =
    question.clientWidth;


  while (
    question.scrollWidth > maxWidth &&
    parseFloat(
      getComputedStyle(question).fontSize
    ) > 40
  ) {

    const currentSize =
      parseFloat(
        getComputedStyle(question).fontSize
      );

    question.style.fontSize =
      (currentSize - 2) + "px";

  }

}


/* =========================================
   三角ボタン
   ========================================= */

function handle() {

  /*
   * 問題がない場合
   */

  if (words.length === 0) {
    return;
  }

if (!revealed) {

    revealed = true;

    questionCount++;

    document.getElementById("counter").textContent =
      questionCount;

    render();

    return;

  }

  currentIndex++;


  /*
   * 最後まで行った場合
   */

  if (
    currentIndex >= words.length
  ) {

    /*
     * 同じ範囲の問題をもう一度シャッフル
     */

    words =
      smartShuffle(
        [...words]
      );


    currentIndex = 0;

  }


  revealed = false;

  render();

}


/* =========================================
   起動
   ========================================= */

loadExcel();


</script>

</body>

</html>
